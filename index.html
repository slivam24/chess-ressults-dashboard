<!doctype html>
<html lang="cs">
<head>
  <!-- ?v=N u souborů: po každé úpravě zvýšit, aby prohlížeče nebraly starou verzi z mezipaměti -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Los kola</title>
  <meta name="description" content="Dashboard na celou obrazovku: los aktuálního kola dvou turnajů z chess-results.com vedle sebe.">
  <meta name="theme-color" content="#11161d">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/dashboard.css?v=8">
</head>
<body>
  <header class="bar" id="bar">
    <div class="clock" id="clock" aria-label="Čas">--:--</div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Zobrazení">
        <button type="button" id="btnLos" title="Los aktuálního kola (L)">Los</button>
        <button type="button" id="btnPoradi" title="Pořadí (P)">Pořadí</button>
        <button type="button" id="btnOba" title="Vlevo los, vpravo pořadí levého turnaje (O)">Los + pořadí</button>
      </div>
      <div class="seg" role="group" aria-label="Velikost písma">
        <button type="button" id="btnZoomOut" title="Zmenšit (−)" aria-label="Zmenšit">A−</button>
        <button type="button" id="btnZoomAuto" title="Automatická velikost (0)">Auto</button>
        <button type="button" id="btnZoomIn" title="Zvětšit (+)" aria-label="Zvětšit">A+</button>
      </div>
      <button type="button" id="btnSettings" title="Nastavení turnajů (S)">⚙ Turnaje</button>
      <button type="button" id="btnFull" title="Celá obrazovka (F)">⛶ Celá obrazovka</button>
    </div>
  </header>

  <main class="boards">
    <section class="panel" id="panelL" aria-label="Turnaj vlevo"></section>
    <section class="panel" id="panelR" aria-label="Turnaj vpravo"></section>
  </main>

  <div class="flash" id="flash" role="status" hidden></div>

  <div class="start" id="start" hidden>
    <button type="button" id="btnStart" class="start-btn">
      <span class="start-icon" aria-hidden="true">⛶</span>
      Spustit na celou obrazovku
      <small>F celá obrazovka · L los · P pořadí · O los + pořadí · + − velikost · Esc ukončí</small>
    </button>
    <button type="button" id="btnStay" class="link-btn">Zůstat v okně</button>
  </div>

  <dialog id="settings" class="settings">
    <form method="dialog" id="settingsForm">
      <h2>Turnaje na dashboardu</h2>
      <p class="hint">Číslo turnaje, nebo odkaz na kteroukoli jeho stránku na chess-results.com.</p>
      <label>Vlevo
        <input name="vlevo" id="inL" autocomplete="off" placeholder="např. 1516901 nebo https://chess-results.com/tnr1516901.aspx">
      </label>
      <label>Vpravo
        <input name="vpravo" id="inR" autocomplete="off" placeholder="např. 1507857">
      </label>
      <label>Pořadí ve dvou sloupcích
        <select id="selColumns">
          <option value="auto">Automaticky (když se tak vejde větší písmo)</option>
          <option value="2">Vždy dva sloupce</option>
          <option value="1">Jen jeden sloupec</option>
        </select>
      </label>
      <label>Prostředník pro živé načítání <span class="opt">(Cloudflare Worker, nepovinné)</span>
        <input name="proxy" id="inProxy" autocomplete="off" inputmode="url" placeholder="https://neco.workers.dev">
      </label>
      <p class="err" id="settingsErr" role="alert"></p>
      <div class="note" id="settingsNote"></div>
      <div class="actions">
        <button type="button" id="btnDefault" class="link-btn">Výchozí turnaje</button>
        <span class="grow"></span>
        <button type="button" id="btnCancel">Zrušit</button>
        <button type="submit" id="btnApply" class="primary">Zobrazit</button>
      </div>
    </form>
  </dialog>

  <noscript>Dashboard potřebuje zapnutý JavaScript.</noscript>
  <script type="module" src="js/dashboard.js?v=8"></script>
</body>
</html>
