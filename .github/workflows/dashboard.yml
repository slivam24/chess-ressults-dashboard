name: Dashboard

# Záložní stažení losu bez prostředníka: los turnajů ze scripts/dashboard.json se uloží do větve
# dashboard-data (jediný soubor dashboard.json, bez historie), odkud ho čte index.html, když
# živé načítání přes Cloudflare nejde. Do main se nic nezapisuje.
#
# Běží jen po změně scripts/dashboard.json a ručně přes Actions → Dashboard → Run workflow
# (kde jdou rovnou zadat dva nové turnaje). Plánované spouštění je vypnuté, protože dashboard
# načítá los živě, jen když je otevřený. Kdyby bylo potřeba stahovat pravidelně (třeba bez
# prostředníka), stačí vrátit:
#   schedule:
#     - cron: "*/10 * * * *"
on:
  push:
    branches: [main]
    paths: [scripts/dashboard.json]
  workflow_dispatch:
    inputs:
      vlevo:
        description: "Turnaj vlevo: číslo nebo odkaz na chess-results (prázdné = beze změny)"
        required: false
      vpravo:
        description: "Turnaj vpravo: číslo nebo odkaz na chess-results (prázdné = beze změny)"
        required: false

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  los:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Nastavit nové turnaje
        if: github.event_name == 'workflow_dispatch' && (inputs.vlevo != '' || inputs.vpravo != '')
        env:
          VLEVO: ${{ inputs.vlevo }}
          VPRAVO: ${{ inputs.vpravo }}
        run: |
          cur_l=$(node -p "require('./scripts/dashboard.json').vlevo")
          cur_p=$(node -p "require('./scripts/dashboard.json').vpravo")
          node scripts/fetch_dashboard.mjs --set "${VLEVO:-$cur_l}" "${VPRAVO:-$cur_p}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m "Dashboard: nové turnaje"
            git pull --rebase --autostash
            git push
          fi

      - name: Je dashboard zapnutý?
        id: cfg
        run: echo "aktivni=$(node -p "require('./scripts/dashboard.json').aktivni !== false")" >> "$GITHUB_OUTPUT"

      - name: Předchozí data
        if: steps.cfg.outputs.aktivni == 'true'
        run: |
          if git fetch --depth=1 origin dashboard-data 2>/dev/null; then
            git show FETCH_HEAD:dashboard.json > "$RUNNER_TEMP/prev.json" || true
          fi

      - name: Stáhnout los
        if: steps.cfg.outputs.aktivni == 'true'
        run: node scripts/fetch_dashboard.mjs --prev "$RUNNER_TEMP/prev.json" --out "$RUNNER_TEMP/dashboard.json"

      - name: Uložit do větve dashboard-data
        if: steps.cfg.outputs.aktivni == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan dashboard-data
          cp "$RUNNER_TEMP/dashboard.json" dashboard.json
          git add dashboard.json
          git commit -q -m "Los pro dashboard"
          git push -f origin dashboard-data
